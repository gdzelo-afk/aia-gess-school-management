name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aia -d aia_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - name: Prepare module PostgreSQL databases
        run: node --input-type=module -e 'import pg from "pg"; const c = new pg.Client({connectionString:process.env.TEST_DATABASE_URL}); await c.connect(); await c.query("CREATE DATABASE aia_timetable_test"); await c.query("CREATE DATABASE aia_attendance_test"); await c.end();'
        env:
          TEST_DATABASE_URL: postgresql://aia:ci-only-password@localhost:5432/aia_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://aia:ci-only-password@localhost:5432/aia_test
          TEST_TIMETABLE_DATABASE_URL: postgresql://aia:ci-only-password@localhost:5432/aia_timetable_test
          TEST_ATTENDANCE_DATABASE_URL: postgresql://aia:ci-only-password@localhost:5432/aia_attendance_test
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated attendance browser persona
        run: npx tsx scripts/prepare-attendance-browser.ts
      - name: Browser checks
        run: |
          export CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
